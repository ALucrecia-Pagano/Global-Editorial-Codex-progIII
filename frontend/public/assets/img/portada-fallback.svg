<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tapa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282236"/>
      <stop offset="100%" stop-color="#181422"/>
    </linearGradient>
    <linearGradient id="lomo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e0b14" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0e0b14" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="oro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0caa3"/>
      <stop offset="100%" stop-color="#b8935c"/>
    </linearGradient>
  </defs>

  <!-- Fondo de cubierta -->
  <rect width="300" height="450" rx="4" fill="url(#tapa)"/>

  <!-- Borde ornamentado interior -->
  <rect x="18" y="18" width="264" height="414" rx="3" fill="none" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="23" y="23" width="254" height="404" rx="2" fill="none" stroke="url(#oro)" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4,3"/>

  <!-- Sombras de lomo izquierdo -->
  <rect x="0" y="0" width="18" height="450" fill="url(#lomo)"/>

  <!-- Emblema central: libro abierto estilizado -->
  <g transform="translate(150, 195)">
    <!-- Destello superior -->
    <path d="M0 -45 L3 -32 L16 -30 L5 -20 L8 -7 L0 -14 L-8 -7 L-5 -20 L-16 -30 L-3 -32 Z" fill="url(#oro)" opacity="0.85"/>
    
    <!-- Libro abierto -->
    <path d="M0 -2 C-14 -12 -38 -12 -60 -4 L-60 48 C-38 40 -14 40 0 50 C14 40 38 40 60 48 L60 -4 C38 -12 14 -12 0 -2 Z" 
          fill="none" stroke="url(#oro)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="0" y1="-2" x2="0" y2="50" stroke="url(#oro)" stroke-width="2.2"/>
    
    <!-- Líneas de lectura en páginas -->
    <line x1="-48" y1="12" x2="-14" y2="9" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="-48" y1="22" x2="-14" y2="19" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="-48" y1="32" x2="-20" y2="29" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <line x1="14" y1="9" x2="48" y2="12" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="14" y1="19" x2="48" y2="22" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="20" y1="29" x2="48" y2="32" stroke="url(#oro)" stroke-width="1.2" stroke-opacity="0.5"/>
  </g>

  <!-- Tipografía editorial -->
  <text x="150" y="305" font-family="'Cinzel', 'Georgia', serif" font-size="15" fill="url(#oro)" font-weight="600" text-anchor="middle" letter-spacing="3">EDITORIAL CODEX</text>
  <line x1="90" y1="320" x2="210" y2="320" stroke="url(#oro)" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="150" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a49eb5" text-anchor="middle" letter-spacing="1.5">SIN PORTADA DISPONIBLE</text>
</svg>
